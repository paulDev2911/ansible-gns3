---
- name: "IPSec VPN zum bestehenden Standort"
  hosts: pfsense
  gather_facts: false
  tasks:
    - name: "Configure IPSec Phase 1 (IKE)"
      pfsensible.core.pfsense_ipsec:
        state: "{{ ipsec_p1_state }}"
        descr: "{{ ipsec_p1_description }}"
        interface: "{{ vpn_interface }}"
        remote_gateway: "{{ remote_gateway }}"
        iketype: "{{ p1_iketype }}"
        authentication_method: "{{ p1_authentication_method }}"
        preshared_key: "{{ p1_preshared_key }}"
        myid_type: "{{ p1_myid_type }}"
        peerid_type: "{{ p1_peerid_type }}"
        lifetime: "{{ p1_lifetime }}"
        nat_traversal: "{{ p1_nat_traversal }}"
        dpd_delay: "{{ p1_maxfail }}"
        dpd_maxfail: "{{ p1_dpd_maxfail }}"
        apply: true

    - name: "Configure IPSec Phase 2 (ESP)"
      pfsensible.core.pfsense_ipsec_p2:
        p1_descr: "{{ ipsec_p1_description }}"
        descr: "{{ ipsec_p2_description }}"
        state: "{{ ipsec_p2_state }}"
        mode: "{{ ipsec_p2_mode }}"
        protocol: "{{ ipsec_p2_protocol }}"
        local: "{{ ipsec_p2_local }}"
        remote: "{{ ipsec_p2_remote }}"
        aes: "{{ ipsec_p2_aes }}"
        aes_len: "{{ ipsec_p2_aes_len }}"
        sha256: "{{ ipsec_p2_sha256 }}"
        pfsgroup: "{{ ipsec_p2_pfsgroup }}"
        lifetime: "{{ ipsec_p2_lifetime }}"

    - name: Add VPN interface
      pfsensible.core.pfsense_interface:
        descr: "{{ item.descr }}"
        interface: "{{ item.interface }}"
        enable: "{{ item.enable | default(True) }}"
      loop: "{{ vpn_interfaces }}"

    - name: Add tunnel VTI gateway
      pfsensible.core.pfsense_gateway:
        name: "{{ ipsec_tunnel_gateway_name }}"
        descr: "{{ ipsec_tunnel_gateway_descr }}"
        interface: "{{ ipsec_tunnel_gateway_interface }}"
        gateway: "{{ ipsec_tunnel_gateway_gateway }}"
        ipprotocol: "{{ ipsec_tunnel_gateway_ipprotocol }}"
        state: "{{ ipsec_tunnel_gateway_state }}"

    - name: Add VPN route
      pfsensible.core.pfsense_route:
        descr: "{{ vpn_route_descr }}"
        gateway: "{{ ipsec_tunnel_gateway_name }}"
        network: "{{ vpn_route_destination_network }}"
        state: "{{ vpn_route_state }}"
